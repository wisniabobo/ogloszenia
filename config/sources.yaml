    coverage: regionalny
    sprawdzono: 2026-09-19
    notes: >
      Grunty i zabudowania z Zasobu Własności Rolnej Skarbu Państwa. KOWR ma
      własny portal (nieruchomoscikowr.gov.pl/nieruchomosci/oferty), ale lista
