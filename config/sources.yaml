      Mieszkania, lokale i grunty po wojsku. Właściwa lista jest pod
      /pl/nieruchomosci/przetargi-nieruchomosci — selektory do dostrojenia
      po pierwszym przebiegu.
    config:
      urls:
        - https://amw.com.pl/pl/nieruchomosci/przetargi-nieruchomosci
        - https://amw.com.pl/pl/nieruchomosci/nieruchomosci-amw

  - key: zus
