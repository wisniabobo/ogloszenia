  # ---------------------------------------------------------------------------
  # 5. BIP — WYKAZY NIERUCHOMOŚCI GMIN I POWIATÓW WOJ. OPOLSKIEGO
  # ---------------------------------------------------------------------------
  # Gminy mają ustawowy obowiązek publikować wykazy nieruchomości przeznaczonych
  # do sprzedaży/dzierżawy (art. 35 ustawy o gospodarce nieruchomościami) — to
  # ogłoszenia, których nie ma na żadnym portalu. Adresy BIP-ów bywają
  # niestandardowe, dlatego wszystkie mają `verify: true`; `ogl check-sources`
  # sprawdzi, które odpowiadają, zanim je włączysz.
  - key: bip_opole_miasto
    name: BIP Urzędu Miasta Opola — nieruchomości
    scraper: generic_html
    kind: wykaz
    category: bip
    base_url: https://www.bip.um.opole.pl
    coverage: lokalny
    enabled: false
    verify: true
    interval_minutes: 720
    config:
      urls: ["https://www.bip.um.opole.pl/?c=mdTresc-cmPokaz-1560"]
      list_selector: "table tr, ul li, article"
      link_selector: "a"
      detail: true
      seller_type: urzad
      authority: Urząd Miasta Opola

