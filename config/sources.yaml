    enabled: false
    verify: true
    config:
      urls:
        - https://www.krn.pl/nieruchomosci/mieszkania/opolskie/sprzedaz
    sprawdzono: 2026-09-19   # strona główna odpowiada, ścieżka do poprawienia

  - key: domy_pl
    name: Domy.pl
    scraper: generic_html
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://domy.pl
    enabled: false
    verify: true
    config:
      urls:
        - https://domy.pl/mieszkania-sprzedaz-opolskie?page={page}

  - key: nportal
    name: Nportal.pl
