# =============================================================================
# REJESTR ŹRÓDEŁ
# =============================================================================
# Każdy wpis: key (unikalny), name, scraper (klasa z ogloszenia/scrapers albo
# `generic_html`), kind, category, enabled, interval_minutes, config.
#
# Pola pomocnicze:
#   verify: true        -> adres/selektory niepotwierdzone na żywym serwisie;
#                          uruchom `ogl check-sources` przed włączeniem
#   sprawdzono: DATA    -> data ostatniej weryfikacji na żywym serwisie
#   config.requires_js  -> wyniki powstają dopiero w przeglądarce; bez silnika JS
#                          źródło nic nie zwróci i skan mówi o tym wprost
#
# Portale zmieniają HTML — dlatego selektory są w konfiguracji, a nie w kodzie.
# =============================================================================

defaults:
  interval_minutes: 15
  max_pages: 5
  max_items: 400

sources:

  # ---------------------------------------------------------------------------
  # 1. PORTALE OGÓLNOPOLSKIE — NIERUCHOMOŚCI
  # ---------------------------------------------------------------------------
  - key: olx
    name: OLX.pl
    scraper: olx
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://www.olx.pl
    enabled: true
    interval_minutes: 8
    coverage: krajowy
    sprawdzono: 2026-09-19
    notes: >
      Najszybsze źródło ofert prywatnych — tu najczęściej pojawiają się okazje,
      zanim trafią do biur. Korzystamy wyłącznie z /api/v1/offers/, czyli
      jedynej ścieżki API, którą OLX sam dopuszcza w robots.txt
      (Disallow: /api/ + Allow: /api/v1/offers/). Pełne numery telefonów
      wymagają tokenu konta OLX — bez niego numery bierzemy z treści ogłoszenia.
    config:
      region_id: 12        # opolskie (zweryfikowane na żywym API)

  - key: otodom
    name: Otodom.pl
    scraper: otodom
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://www.otodom.pl
    enabled: true
    interval_minutes: 10
    coverage: krajowy
    sprawdzono: 2026-09-19
    notes: Największy portal ofert biur i deweloperów. Dane w __NEXT_DATA__.
    config:
      region_slug: opolskie

  - key: gratka
    name: Gratka.pl
    scraper: gratka
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://gratka.pl
    enabled: true
    interval_minutes: 20
    coverage: krajowy
    sprawdzono: 2026-09-19
    notes: >
      robots.txt dopuszcza wyłącznie strony page=2 … page=10 i zabrania
      parametru sort= — scraper trzyma się tych granic.

  - key: morizon
    name: Morizon.pl
    scraper: morizon
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://www.morizon.pl
    enabled: true
    interval_minutes: 20
    coverage: krajowy
    sprawdzono: 2026-09-19
    notes: >
      Grupa Morizon-Gratka; duże pokrycie ofert biur. robots.txt zabrania
      parametrów ps[...], sort= i limit=, więc paginujemy samym page=
      i bierzemy domyślne sortowanie.

  - key: nieruchomosci_online
    name: Nieruchomosci-online.pl
    scraper: nieruchomosci_online
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://www.nieruchomosci-online.pl
    enabled: false
    interval_minutes: 20
    coverage: krajowy
    sprawdzono: 2026-09-19
    notes: >
      Strona odpowiada, ale lista wyników powstaje dopiero w przeglądarce —
      w HTML-u nie ma ani jednego linku do oferty. Wymaga silnika JS.
    config:
      requires_js: true

  - key: domiporta
    name: Domiporta.pl
    scraper: domiporta
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://www.domiporta.pl
    enabled: true
    interval_minutes: 30
    coverage: krajowy
    sprawdzono: 2026-09-19

  - key: adresowo
    name: Adresowo.pl
    scraper: adresowo
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://adresowo.pl
    enabled: false
    interval_minutes: 30
    coverage: krajowy
    sprawdzono: 2026-09-19
    notes: >
      Agreguje też oferty bez pośredników, ale w HTML-u karty mają wyłącznie
      lokalizację — cena i metraż dociągane są skryptem. Wymaga silnika JS.
    config:
      requires_js: true

  - key: otoprzeprowadzki_oferty_net
    name: Oferty.net
    scraper: generic_html
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://www.oferty.net
    enabled: false
    verify: true
    config:
      urls:
        - https://www.oferty.net/mieszkania/opolskie/sprzedaz/?page={page}
        - https://www.oferty.net/domy/opolskie/sprzedaz/?page={page}
      list_selector: "article, div.offer-item"
      link_selector: "a"
      title_selector: "h2, h3"
      price_selector: ".price"

  - key: szybko
    name: Szybko.pl
    scraper: generic_html
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://www.szybko.pl
    enabled: false
    verify: true
    config:
      urls:
        - https://www.szybko.pl/l/opolskie/mieszkania/sprzedaz?page={page}
        - https://www.szybko.pl/l/opolskie/domy/sprzedaz?page={page}
      list_selector: "article, li.offer"
      link_selector: "a"
      title_selector: "h2, h3"

  - key: gethome
    name: GetHome.pl
    scraper: generic_html
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://gethome.pl
    enabled: false
    verify: true
    notes: Rynek pierwotny i wtórny; dużo ofert deweloperskich.
    config:
      urls:
        - https://gethome.pl/mieszkania/na-sprzedaz/opolskie/?page={page}
        - https://gethome.pl/domy/na-sprzedaz/opolskie/?page={page}

  - key: rynekpierwotny
    name: RynekPierwotny.pl
    scraper: generic_html
    kind: nieruchomosc
    category: portal_krajowy
