  # ---------------------------------------------------------------------------
  # 3. LICYTACJE — KOMORNICZE, SYNDYCZNE, SKARBOWE
  # ---------------------------------------------------------------------------
  - key: licytacje_komornik
    name: Licytacje komornicze (Krajowa Rada Komornicza)
    scraper: licytacje_komornik
    kind: licytacja
    category: licytacje
    base_url: https://licytacje.komornik.pl
    enabled: true
    interval_minutes: 60
    coverage: krajowy
    sprawdzono: 2026-09-19
    notes: >
      Najważniejsze źródło okazji cenowych. Cena wywoławcza w I terminie to
      3/4 sumy oszacowania, w II — 2/3; rękojmia to 1/10 oszacowania (liczymy
      ją sami, bo karta wyników jej nie podaje). Serwis został przebudowany:
      stary /Notice/Search jest dziś w robots.txt zabroniony, korzystamy
      z /wyszukiwarka-licytacji. Szczegóły obwieszczenia (sygnatura, kancelaria)
      dociągane są skryptem, więc bierzemy to, co jest na karcie wyników.
    config:
      province: opolskie
      main_categories: ["REAL_ESTATE"]   # dodaj "MOVABLE" dla ruchomości

  - key: elicytacje
    name: e-Licytacje komornicze
    scraper: elicytacje
    kind: licytacja
    category: licytacje
    base_url: https://elicytacje.komornik.pl
    enabled: true
    interval_minutes: 45
    coverage: krajowy
    sprawdzono: 2026-09-19
    notes: >
      Osobny serwis elicytacje.komornik.pl został wygaszony i przekierowuje na
      licytacje.komornik.pl. To źródło filtruje ten sam serwis po trybie
      elektronicznym — bywa puste, gdy akurat nie ma e-licytacji w regionie.
    config:
      province: opolskie

  - key: krz
    name: Krajowy Rejestr Zadłużonych — obwieszczenia syndyków
    scraper: krz
    kind: licytacja
    category: licytacje
    base_url: https://krz.ms.gov.pl
    enabled: true
    interval_minutes: 120
    coverage: krajowy
    verify: true
    notes: >
      Sprzedaż z masy upadłości (syndycy). Często nieruchomości znacząco
      poniżej wartości rynkowej, sprzedawane w trybie konkursu ofert.
    config:
      voivodeship: OPOLSKIE

  - key: msig_imsig
    name: Monitor Sądowy i Gospodarczy (iMSiG)
