defaults:
  interval_minutes: 15
  max_pages: 5
  max_items: 400
  deep_max_pages: 60
  deep_max_items: 20000
sources:
- key: olx
  name: OLX.pl
  scraper: olx
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://www.olx.pl
  enabled: true
  interval_minutes: 8
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Najszybsze źródło ofert prywatnych — tu najczęściej pojawiają się okazje, zanim trafią do biur.
    Korzystamy wyłącznie z /api/v1/offers/, czyli jedynej ścieżki API, którą OLX sam dopuszcza w robots.txt
    (Disallow: /api/ + Allow: /api/v1/offers/). Pełne numery telefonów wymagają tokenu konta OLX — bez
    niego numery bierzemy z treści ogłoszenia.

    '
  config: {}
- key: otodom
  name: Otodom.pl
  scraper: otodom
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://www.otodom.pl
  enabled: true
  interval_minutes: 10
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: Największy portal ofert biur i deweloperów. Dane w __NEXT_DATA__.
  config: {}
- key: gratka
  name: Gratka.pl
  scraper: gratka
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://gratka.pl
  enabled: true
  interval_minutes: 20
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'robots.txt dopuszcza wyłącznie strony page=2 … page=10 i zabrania parametru sort= — scraper
    trzyma się tych granic.

    '
- key: morizon
  name: Morizon.pl
  scraper: morizon
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://www.morizon.pl
  enabled: true
  interval_minutes: 20
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Grupa Morizon-Gratka; duże pokrycie ofert biur. robots.txt zabrania parametrów ps[...], sort=
    i limit=, więc paginujemy samym page= i bierzemy domyślne sortowanie.

    '
- key: nieruchomosci_online
  name: Nieruchomosci-online.pl
  scraper: nieruchomosci_online
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://www.nieruchomosci-online.pl
  enabled: false
  interval_minutes: 20
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Strona odpowiada, ale lista wyników powstaje dopiero w przeglądarce — w HTML-u nie ma ani jednego
    linku do oferty. Wymaga silnika JS.

    '
  config:
    requires_js: true
- key: domiporta
  name: Domiporta.pl
  scraper: domiporta
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://www.domiporta.pl
  enabled: true
  interval_minutes: 30
  coverage: krajowy
  sprawdzono: 2026-09-19
- key: adresowo
  name: Adresowo.pl
  scraper: adresowo
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://adresowo.pl
  enabled: false
  interval_minutes: 30
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Agreguje też oferty bez pośredników, ale w HTML-u karty mają wyłącznie lokalizację — cena i
    metraż dociągane są skryptem. Wymaga silnika JS.

    '
  config:
    requires_js: true
- key: otoprzeprowadzki_oferty_net
  name: Oferty.net
  scraper: generic_html
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://www.oferty.net
  enabled: false
  verify: true
  config:
    urls:
    - https://www.oferty.net/mieszkania/{region}/sprzedaz/?page={page}
    - https://www.oferty.net/domy/{region}/sprzedaz/?page={page}
    list_selector: article, div.offer-item
    link_selector: a
    title_selector: h2, h3
    price_selector: .price
- key: szybko
  name: Szybko.pl
  scraper: generic_html
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://www.szybko.pl
  enabled: false
  verify: true
  config:
    urls:
    - https://www.szybko.pl/l/{region}/mieszkania/sprzedaz?page={page}
    - https://www.szybko.pl/l/{region}/domy/sprzedaz?page={page}
    list_selector: article, li.offer
    link_selector: a
    title_selector: h2, h3
- key: gethome
  name: GetHome.pl
  scraper: gethome
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://gethome.pl
  enabled: true
  interval_minutes: 30
  coverage: krajowy
  sprawdzono: 2026-09-20
  notes: "Lista renderowana po stronie serwera, więc czytelna bez przeglądarki. Nazwy klas CSS portal generuje losowo przy każdym wdrożeniu, dlatego parser trzyma się znacznika address i układu tekstu karty, a nie selektorów."
  config:
    sections:
    - path: /mieszkania/na-sprzedaz/{region}/
      transaction: sprzedaz
    - path: /domy/na-sprzedaz/{region}/
      transaction: sprzedaz
    - path: /dzialki/na-sprzedaz/{region}/
      transaction: sprzedaz
    - path: /lokale-uzytkowe/na-sprzedaz/{region}/
      transaction: sprzedaz
    - path: /mieszkania/do-wynajecia/{region}/
      transaction: wynajem
    - path: /domy/do-wynajecia/{region}/
      transaction: wynajem
- key: rynekpierwotny
  name: RynekPierwotny.pl
  scraper: generic_html
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://rynekpierwotny.pl
  enabled: false
  verify: true
  notes: Wyłącznie rynek pierwotny (deweloperzy) — w Opolu kilkanaście inwestycji.
  config:
    urls:
    - https://rynekpierwotny.pl/s/{region}/?page={page}
- key: tabelaofert
  name: TabelaOfert.pl
  scraper: generic_html
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://tabelaofert.pl
  enabled: false
  sprawdzono: 2026-09-19
  notes: Serwis odrzuca automaty (HTTP 403).
- key: krn
  name: KRN.pl
  scraper: generic_html
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://www.krn.pl
  enabled: false
  verify: true
  config:
    urls:
    - https://www.krn.pl/nieruchomosci/mieszkania/{region}/sprzedaz
  sprawdzono: 2026-09-19
- key: domy_pl
  name: Domy.pl
  scraper: generic_html
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://domy.pl
  enabled: false
  verify: true
  config:
    urls:
    - https://domy.pl/mieszkania-sprzedaz-{region}?page={page}
- key: nportal
  name: Nportal.pl
  scraper: generic_html
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://nportal.pl
  enabled: false
  verify: true
- key: facebook_marketplace
  name: Facebook Marketplace
  scraper: generic_html
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://www.facebook.com/marketplace
  enabled: false
  requires_credentials: true
  notes: 'WYŁĄCZONE ŚWIADOMIE. Marketplace wymaga zalogowanego konta, a regulamin Meta zakazuje automatycznego
    pobierania treści. Obsługa możliwa wyłącznie przez oficjalne API partnerskie albo ręczny import —
    nie przez bota.

    '
- key: gumtree
  name: Gumtree.pl
  scraper: generic_html
  kind: nieruchomosc
  category: portal_krajowy
  base_url: https://www.gumtree.pl
  enabled: false
  notes: Serwis zamknięty w Polsce — wpis historyczny, do ewentualnych archiwów.
- key: katalog_biur
  name: Katalog biur nieruchomości (Otodom)
  scraper: katalog_biur
  kind: inne
  category: katalogi
  base_url: https://www.otodom.pl/pl/firmy/biura-nieruchomosci
  enabled: true
  interval_minutes: 1440
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Najlepsze źródło listy pośredników, jakie istnieje: biura same się tam rejestrują. Oddaje pełny
    numer telefonu, adres z kodem pocztowym, województwo i liczbę aktywnych ofert — po tej ostatniej
    widać, czy nasz skan zebrał u danego biura wszystko. Bez zawężania regionem katalog zwraca 13 047
    biur i deweloperów z całej Polski (sprawdzone 20.09.2026). To źródło nie tworzy ogłoszeń, tylko
    zasila rejestr biur.

    '
  config:
    max_pages: 800
- key: nto_ogloszenia
  name: NTO — Nowa Trybuna Opolska (ogłoszenia)
  scraper: generic_html
  kind: nieruchomosc
  category: portal_lokalny
  base_url: https://nto.pl
  coverage: regionalny
  enabled: false
  sprawdzono: 2026-09-19
  notes: 'Subdomena ogloszenia.nto.pl nie odpowiada, a nto.pl odrzuca automaty (HTTP 403). Wpis zostaje
    na wypadek powrotu serwisu.

    '
- key: opole_naszemiasto
  name: Opole — NaszeMiasto
  scraper: generic_html
  kind: nieruchomosc
  category: portal_lokalny
  base_url: https://opole.naszemiasto.pl
  coverage: regionalny
  enabled: false
  verify: true
- key: kedzierzynkozle_info
  name: KedzierzynKozle.info — ogłoszenia
  scraper: generic_html
  kind: nieruchomosc
  category: portal_lokalny
  base_url: https://kedzierzynkozle.info
  coverage: lokalny
  enabled: false
  sprawdzono: 2026-09-19
  notes: Domena nie rozwiązuje się — do sprawdzenia, czy serwis zmienił adres.
- key: nysa_info
  name: Nysa.info / Nyskie.info — ogłoszenia
  scraper: generic_html
  kind: nieruchomosc
