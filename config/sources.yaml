  base_url: https://nysa.info
  coverage: lokalny
  enabled: false
  verify: true
- key: brzeg24
  name: Brzeg24.pl — ogłoszenia
  scraper: generic_html
  kind: nieruchomosc
  category: portal_lokalny
  base_url: https://brzeg24.pl
  coverage: lokalny
  enabled: false
  verify: true
- key: strzelceopolskie_info
  name: Strzelceopolskie.pl — ogłoszenia
  scraper: generic_html
  kind: nieruchomosc
  category: portal_lokalny
  base_url: https://strzelceopolskie.pl
  coverage: lokalny
  enabled: false
  verify: true
- key: licytacje_komornik
  name: Licytacje komornicze (Krajowa Rada Komornicza)
  scraper: licytacje_komornik
  kind: licytacja
  category: licytacje
  base_url: https://licytacje.komornik.pl
  enabled: true
  interval_minutes: 60
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Najważniejsze źródło okazji cenowych. Cena wywoławcza w I terminie to 3/4 sumy oszacowania,
    w II — 2/3; rękojmia to 1/10 oszacowania (liczymy ją sami, bo karta wyników jej nie podaje). Serwis
    został przebudowany: stary /Notice/Search jest dziś w robots.txt zabroniony, korzystamy z /wyszukiwarka-licytacji.
    Szczegóły obwieszczenia (sygnatura, kancelaria) dociągane są skryptem, więc bierzemy to, co jest na
    karcie wyników.

    '
  config:
    province: ''
    main_categories:
    - REAL_ESTATE
- key: elicytacje
  name: e-Licytacje komornicze
  scraper: elicytacje
  kind: licytacja
  category: licytacje
  base_url: https://elicytacje.komornik.pl
  enabled: true
  interval_minutes: 45
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Osobny serwis elicytacje.komornik.pl został wygaszony i przekierowuje na licytacje.komornik.pl.
    To źródło filtruje ten sam serwis po trybie elektronicznym — bywa puste, gdy akurat nie ma e-licytacji
    w regionie.

    '
  config:
    province: ''
- key: elicytacje_kas
  name: eLicytacje KAS (urzędy skarbowe)
  scraper: elicytacje_kas
  kind: licytacja
  category: licytacje
  base_url: https://elicytacje.mf.gov.pl
  enabled: true
  interval_minutes: 90
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Portal KAS działa od 1 lipca 2026 i zebrał w jednym miejscu licytacje, przetargi ofert i sprzedaż
    z wolnej ręki majątku zajętego w egzekucji skarbowej. Publiczne API bez konta; filtra po województwie
    nie ma, więc pobieramy całą sekcję "Nieruchomości" i odsiewamy słownikiem regionu.

    '
  config:
    section_id: 8777b999-fbac-4696-a11e-5323a52760f1
- key: msig
  name: Monitor Sądowy i Gospodarczy (syndycy)
  scraper: msig
  kind: licytacja
  category: licytacje
  base_url: https://wyszukiwarka-msig.ms.gov.pl
  enabled: true
  interval_minutes: 720
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Obwieszczenia syndyków o sprzedaży majątku z masy upadłości. API zwraca metadane pozycji; pełna
    treść jest w numerze Monitora (PDF), więc zapisujemy podmiot, sygnaturę i link.

    '
  config:
    days_back: 120
- key: krz
  name: Krajowy Rejestr Zadłużonych — obwieszczenia syndyków
  scraper: krz
  kind: licytacja
  category: licytacje
  base_url: https://krz.ms.gov.pl
  enabled: true
  interval_minutes: 120
  coverage: krajowy
  verify: true
  notes: 'Sprzedaż z masy upadłości (syndycy). Często nieruchomości znacząco poniżej wartości rynkowej,
    sprzedawane w trybie konkursu ofert.

    '
  config:
    voivodeship: OPOLSKIE
- key: msig_imsig
  name: Monitor Sądowy i Gospodarczy (iMSiG)
  scraper: generic_html
  kind: licytacja
  category: licytacje
  base_url: https://www.imsig.pl
  enabled: false
  verify: true
  notes: Obwieszczenia upadłościowe i o sprzedaży — uzupełnienie KRZ.
- key: kas_licytacje
  name: KAS — licytacje egzekucyjne urzędów skarbowych
  scraper: generic_html
  kind: licytacja
  category: licytacje
  base_url: https://www.podatki.gov.pl
  enabled: false
  verify: true
  notes: Licytacje ruchomości i nieruchomości zajętych przez urzędy skarbowe.
- key: licytacje_syndyk
  name: Portale aukcyjne syndyków
  scraper: generic_html
  kind: licytacja
  category: licytacje
  base_url: https://syndyk.pl
  enabled: false
  sprawdzono: 2026-09-19
  notes: Serwer nie odpowiada (timeout) — do ponownego sprawdzenia.
- key: ezamowienia
  name: Platforma e-Zamówienia
  scraper: ezamowienia
  kind: przetarg
  category: przetargi
  base_url: https://ezamowienia.gov.pl
  enabled: false
  interval_minutes: 180
  coverage: krajowy
  sprawdzono: 2026-09-20
  notes: "Wyłączone. BZP to zamówienia publiczne — gminy ogłaszają tam, co chcą KUPIĆ, a nie co sprzedają. Sprawdzone na 200 ostatnich ogłoszeniach z kraju: ani jednego z CPV 70 (usługi w zakresie nieruchomości), a z opolskiego same roboty drogowe i oprogramowanie. Sprzedaż mienia komunalnego ogłasza się w BIP gminy, nie w BZP — stamtąd bierzemy przetargi na nieruchomości."
  config:
    voivodeship: OPOLSKIE
    cpv_prefixes:
    - '70'
- key: bzp
  name: Biuletyn Zamówień Publicznych (UZP)
  scraper: generic_html
  kind: przetarg
  category: przetargi
  base_url: https://ezamowienia.gov.pl/mp-client/search/list
  enabled: false
  verify: true
- key: kowr
  name: KOWR — nieruchomości rolne (OT Opole)
  scraper: kowr
  kind: przetarg
  category: instytucje
  base_url: https://www.nieruchomoscikowr.gov.pl
  enabled: false
  interval_minutes: 360
  coverage: regionalny
  sprawdzono: 2026-09-19
  notes: 'Grunty i zabudowania z Zasobu Własności Rolnej Skarbu Państwa. KOWR ma własny portal (nieruchomoscikowr.gov.pl/nieruchomosci/oferty),
    ale lista ofert ładuje się skryptem — wymaga silnika JS.

    '
  config:
    requires_js: true
    urls:
    - https://www.nieruchomoscikowr.gov.pl/nieruchomosci/oferty
- key: amw
  name: Agencja Mienia Wojskowego
  scraper: amw
  kind: przetarg
  category: instytucje
  base_url: https://amw.com.pl
  enabled: true
  interval_minutes: 360
  coverage: krajowy
  sprawdzono: 2026-09-20
  notes: 'Mieszkania, lokale i grunty po wojsku. Cała lista przetargów mieści się
    na jednej stronie wyników (ok. 80 pozycji z kraju), a każda karta podaje wprost
    województwo, powiat i gminę — region filtrujemy po tym polu.

    '
- key: zus
  name: ZUS — sprzedaż i najem nieruchomości
  scraper: zus
  kind: wykaz
  category: instytucje
  base_url: https://www.zus.pl
  enabled: true
  interval_minutes: 720
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Ogłoszenia ZUS o sprzedaży i wynajmie nieruchomości oraz o mieniu zbędnym. Właściwy adres to
    zus.pl/o-zus/inne-ogloszenia/... (bip.zus.pl nie prowadzi do listy).

    '
  config:
    urls:
    - https://www.zus.pl/o-zus/inne-ogloszenia/sprzedaz-i-wynajem-nieruchomosci
    - https://www.zus.pl/o-zus/inne-ogloszenia/mienie-zbedne
- key: pkp
  name: PKP S.A. — sprzedaż nieruchomości
  scraper: pkp
  kind: przetarg
  category: instytucje
  base_url: https://www.pkp.pl
  enabled: true
  interval_minutes: 720
  coverage: krajowy
  sprawdzono: 2026-09-19
  notes: 'Dworce, budynki przydworcowe, grunty kolejowe i mieszkania zakładowe. Właściwy adres to pkp.pl/pl/sprzedaz
    — dawna domena nieruchomosci.pkp.pl nie rozwiązuje się w DNS.

    '
- key: pkp_nieruchomosci
  name: PKP S.A. — nieruchomości (stary adres)
  scraper: generic_html
  kind: przetarg
  category: instytucje
  base_url: https://nieruchomosci.pkp.pl
  enabled: false
  verify: true
  sprawdzono: 2026-09-19
  notes: 'Dworce, budynki i grunty kolejowe. Domena nieruchomosci.pkp.pl nie rozwiązuje się — przed włączeniem
    trzeba znaleźć aktualny adres.

    '
  config:
    list_selector: article, tr, div.offer
    detail: true
- key: lasy_panstwowe
  name: Lasy Państwowe — nieruchomości do sprzedaży
  scraper: generic_html
  kind: przetarg
  category: instytucje
  base_url: https://www.gov.pl/web/dglp/nieruchomosci-przeznaczone-do-sprzedazy
  enabled: false
  sprawdzono: 2026-09-19
  notes: 'Dyrekcja Generalna Lasów Państwowych publikuje wykaz na gov.pl. Strona odpowiada; selektory
    do dostrojenia po pierwszym przebiegu.

    '
  config:
    urls:
    - https://www.gov.pl/web/dglp/nieruchomosci-przeznaczone-do-sprzedazy
    list_selector: article, li, tr
    link_selector: a
    detail: true
    seller_type: instytucja
    authority: Lasy Państwowe
- key: kzn
  name: Krajowy Zasób Nieruchomości
  scraper: generic_html
  kind: przetarg
  category: instytucje
  base_url: https://kzn.bip.gov.pl
  enabled: false
  sprawdzono: 2026-09-19
  notes: 'Domena kzn.gov.pl nie odpowiada, ale BIP pod kzn.bip.gov.pl działa — tam trafiają ogłoszenia
    o gruntach pod budownictwo mieszkaniowe.

    '
  config:
    urls:
    - https://kzn.bip.gov.pl/ogloszenia/
    list_selector: article, li, tr
    detail: true
- key: poczta_polska
  name: Poczta Polska — sprzedaż nieruchomości
  scraper: generic_html
  kind: przetarg
  category: instytucje
  base_url: https://www.poczta-polska.pl
  enabled: false
  verify: true
- key: bip_opole_miasto
  name: BIP Urzędu Miasta Opola — nieruchomości
  scraper: generic_html
  kind: wykaz
  category: bip
  base_url: https://www.bip.um.opole.pl
  coverage: lokalny
  enabled: false
  verify: true
  interval_minutes: 720
  config:
    urls:
    - https://www.bip.um.opole.pl/?c=mdTresc-cmPokaz-1560
    list_selector: table tr, ul li, article
    link_selector: a
    detail: true
    seller_type: urzad
    authority: Urząd Miasta Opola
  requires_js: true
  notes: "Silnik SISCO renderuje listę ogłoszeń skryptem — w HTML-u jest tylko „Proszę czekać”. Bez przeglądarki nie da się tego odczytać."
- key: bip_powiat_opolski
  name: "BIP Powiatu Opolskiego — nieruchomości"
  scraper: bip
  kind: przetarg
  category: bip
  base_url: https://bip.powiatopolski.pl
  enabled: true
  interval_minutes: 720
  coverage: lokalny
