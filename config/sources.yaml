    enabled: false
    verify: true
    notes: Wyłącznie rynek pierwotny (deweloperzy) — w Opolu kilkanaście inwestycji.
    config:
      urls:
        - https://rynekpierwotny.pl/s/opolskie/?page={page}

  - key: tabelaofert
    name: TabelaOfert.pl
    scraper: generic_html
    kind: nieruchomosc
