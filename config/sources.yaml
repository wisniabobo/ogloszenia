# =============================================================================
# REJESTR ŹRÓDEŁ
# =============================================================================
# Każdy wpis: key (unikalny), name, scraper (klasa z ogloszenia/scrapers albo
# `generic_html`), kind, category, enabled, interval_minutes, config.
#
# `verify: true` oznacza, że adres/selektory zostały wpisane z rozpoznania, ale
# nie były potwierdzone na żywym serwisie — przed włączeniem uruchom
# `ogl check-sources`, który odpyta każdy URL i pokaże, co odpowiada.
#
# Portale zmieniają HTML — dlatego selektory są w konfiguracji, a nie w kodzie.
# =============================================================================

defaults:
  interval_minutes: 15
  max_pages: 5
  max_items: 400

sources:

  # ---------------------------------------------------------------------------
  # 1. PORTALE OGÓLNOPOLSKIE — NIERUCHOMOŚCI
  # ---------------------------------------------------------------------------
  - key: olx
    name: OLX.pl
    scraper: olx
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://www.olx.pl
    enabled: true
    interval_minutes: 8
    coverage: krajowy
    notes: >
      Publiczne API v1. Najszybsze źródło ofert prywatnych — tu najczęściej
      pojawiają się okazje przed biurami. Pełne numery telefonów wymagają
      tokenu konta OLX (config.auth_token); bez niego numery lecą z treści.
    config:
      paths:
        - nieruchomosci/mieszkania/sprzedaz/opolskie/
        - nieruchomosci/mieszkania/wynajem/opolskie/
        - nieruchomosci/domy/sprzedaz/opolskie/
        - nieruchomosci/domy/wynajem/opolskie/
        - nieruchomosci/dzialki/sprzedaz/opolskie/
        - nieruchomosci/lokale/sprzedaz/opolskie/
        - nieruchomosci/lokale/wynajem/opolskie/
        - nieruchomosci/garaze-parkingi/opolskie/
        - nieruchomosci/pokoje/opolskie/
        - nieruchomosci/stancje-pokoje/opolskie/

  - key: otodom
    name: Otodom.pl
    scraper: otodom
    kind: nieruchomosc
    category: portal_krajowy
    base_url: https://www.otodom.pl
    enabled: true
    interval_minutes: 10
    coverage: krajowy
    notes: Największy portal ofert biur i deweloperów. Dane w __NEXT_DATA__.
    config:
      region_slug: opolskie

  - key: gratka
    name: Gratka.pl
