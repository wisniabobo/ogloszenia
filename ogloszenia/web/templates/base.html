<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Oferty nieruchomości — woj. opolskie{% endblock %}</title>
<meta name="description" content="Oferty nieruchomości, licytacje komornicze i przetargi z całego województwa opolskiego w jednym miejscu. Bez konta, bez limitów.">
<link rel="stylesheet" href="{{ asset('app.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='7' y='7' width='18' height='18' rx='4' transform='rotate(45 16 16)' fill='%2315654a'/></svg>">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="/">
      <span class="brand__mark"></span>
      ogłoszenia
      <span class="brand__where">woj. opolskie</span>
    </a>

    <button class="burger" onclick="toggleNav()" aria-label="Menu">☰</button>

    <nav class="mainnav" id="mainnav">
      <a href="/nieruchomosci" class="{{ 'is-active' if active == 'nieruchomosci' }}">Oferty</a>
      <a href="/mapa"          class="{{ 'is-active' if active == 'mapa' }}">Mapa</a>
      <a href="/licytacje"     class="{{ 'is-active' if active == 'licytacje' }}">Licytacje</a>
      <a href="/przetargi"     class="{{ 'is-active' if active == 'przetargi' }}">Przetargi</a>
      <a href="/biura"         class="{{ 'is-active' if active == 'biura' }}">Biura</a>
      <a href="/poszukiwania"  class="{{ 'is-active' if active == 'poszukiwania' }}">Alerty</a>
      <a href="/schowek"       class="{{ 'is-active' if active == 'schowek' }}">Schowek</a>
      <a href="/rynek"         class="{{ 'is-active' if active == 'rynek' }}">Rynek w liczbach</a>
      <a href="/zrodla"        class="{{ 'is-active' if active == 'zrodla' }}">Źródła</a>
    </nav>

    <span class="topbar__meta">darmowe · bez konta</span>
  </div>
</header>

<main class="page">
  <div class="page__head">
    <h1>{% block heading %}{% endblock %}</h1>
    {% block subhead %}{% endblock %}
    <div class="page__actions">{% block actions %}{% endblock %}</div>
  </div>
  {% block content %}{% endblock %}
</main>

<script src="{{ asset('app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
