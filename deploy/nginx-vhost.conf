# vhost dla bot.wisnia.dev — dokładany do nginxa, który już na serwerze działa.
#
#   sudo cp deploy/nginx-vhost.conf /etc/nginx/sites-available/bot.wisnia.dev
#   sudo ln -sf /etc/nginx/sites-available/bot.wisnia.dev /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/cache/nginx/ogloszenia
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bot.wisnia.dev
#
# Celowo jest tu tylko blok na porcie 80. `certbot --nginx` sam skopiuje go
# na port 443, dopisze certyfikat i przekierowanie — dzięki temu nie trzeba
# ręcznie pilnować dwóch kopii tej samej konfiguracji, a `nginx -t` przechodzi
# od pierwszej chwili (co jest ważne, bo nieudany test zdjąłby też pozostałe
# domeny obsługiwane przez ten serwer).

proxy_cache_path /var/cache/nginx/ogloszenia levels=1:2 keys_zone=ogl_cache:10m
                 max_size=256m inactive=10m use_temp_path=off;

upstream ogloszenia_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name bot.wisnia.dev;

    access_log /var/log/nginx/ogloszenia.access.log;
    error_log  /var/log/nginx/ogloszenia.error.log;

    client_max_body_size 4m;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Statyki są wersjonowane razem z obrazem — przeglądarka może je trzymać.
    location /static/ {
        proxy_pass http://ogloszenia_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache ogl_cache;
        proxy_cache_valid 200 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        add_header X-Cache $upstream_cache_status;
    }

    # Publiczne API bez kluczy — otwarte dla wszystkich, z krótkim cache.
    # `proxy_cache_lock` sprawia, że nawet przy nagłym ruchu aplikacja liczy
    # daną odpowiedź raz, a nie tyle razy, ilu jest jednoczesnych gości.
    location /api/ {
        proxy_pass http://ogloszenia_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache ogl_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        proxy_pass http://ogloszenia_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        proxy_cache ogl_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;
        add_header X-Cache $upstream_cache_status;
    }
}
