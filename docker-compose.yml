# Aplikacja słucha WYŁĄCZNIE na 127.0.0.1:8000 i nie dotyka portów 80/443 —
# na serwerze zwykle stoi już jakiś serwer WWW (u nas nginx obsługujący inne
# domeny) i przejęcie tych portów zdmuchnęłoby działające strony.
#
# HTTPS i kierowanie ruchu robi nginx z hosta: deploy/nginx-vhost.conf
#
#   docker compose up -d
#
# Kto zaczyna na czystym serwerze i nie ma własnego nginxa, może zamiast tego
# włączyć wbudowane Caddy (samo wystawia certyfikat):
#
#   docker compose --profile caddy up -d

services:
  web:
    build: .
    image: ogloszenia:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      OGL_DATABASE_URL: sqlite:////data/ogloszenia.db
      OGL_WEB_HOST: 0.0.0.0
    volumes:
      - ogl-data:/data
    ports:
      # tylko pętla zwrotna — z internetu nie da się tu wejść bezpośrednio
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Zbieranie ofert chodzi osobno, żeby wolny portal nigdy nie spowolnił
  # serwowania strony. Ten sam obraz, inna komenda.
  worker:
    build: .
    image: ogloszenia:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      OGL_DATABASE_URL: sqlite:////data/ogloszenia.db
    volumes:
      - ogl-data:/data
    command: ["python", "-m", "ogloszenia.cli", "watch"]
    depends_on:
      web:
        condition: service_healthy

  # Uruchamiane tylko przez `--profile caddy`, gdy na serwerze nie ma nginxa.
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    env_file: [.env]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web]

volumes:
  ogl-data:
  caddy-data:
  caddy-config:
